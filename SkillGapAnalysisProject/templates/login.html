{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
  /* Full height section and center content */
  .login-section {
    min-height: 60vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f7fa;
  }

  /* Card styling */
  .login-card {
    width: 400px;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    background: #fff;
  }

  /* Icon inside input */
  .login-card .position-relative i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #007bff;
  }

  .login-card .form-control.ps-5 {
    padding-left: 2.5rem !important;
  }

  /* Button */
  .login-card .btn-primary {
    font-weight: 600;
    transition: all 0.3s ease;
  }
  .login-card .btn-primary:hover {
    background-color: #0056b3;
  }

  /* Links */
  .login-card .text-center a {
    text-decoration: none;
    color: #007bff;
    transition: color 0.3s ease;
  }
  .login-card .text-center a:hover {
    color: #0056b3;
  }

  /* Responsive adjustments */
  @media (max-width: 480px) {
    .login-card {
      width: 90%;
      padding: 1.5rem;
    }
  }
</style>

<section class="login-section">
  <div class="login-card card">
    <h2 class="text-center mb-4">Login 🔐</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3 position-relative">
        <i class="bi bi-person-fill"></i>
        <input type="text" name="email" class="form-control ps-5" placeholder="Email or Username" required>
      </div>
      <div class="mb-3 position-relative">
        <i class="bi bi-lock-fill"></i>
        <input type="password" name="password" class="form-control ps-5" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="mt-3 text-center">
      <a href="{{ url_for('auth.register') }}">New user? Register</a>
    </div>
  </div>
</section>

{% endblock %}
