{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #fdfbfb, #ebedee);
    font-family: 'Poppins', sans-serif;
}
.auth-wrapper {
    min-height: calc(85vh - 90px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 15px;
}
.auth-card {
    background: #fff;
    border-radius: 20px;
    padding: 20px 25px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    animation: fadeInUp 0.9s ease;
    width: 100%;
    max-width: 500px;
    text-align: center;
}
.auth-card h1 {
    font-weight: 700;
    color: #333;
    margin-bottom: 2px;
}
.form-control {
    border-radius: 12px;
    padding: 12px 12px 12px 42px;
    border: 1px solid #ddd;
    transition: all 0.3s ease;
}
.form-control:focus {
    border-color: #007bff;
    box-shadow: 0 0 10px rgba(0,123,255,0.3);
}
.input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #007bff;
    font-size: 1.2rem;
}
.btn-auth {
    background: linear-gradient(135deg, #007bff, #6610f2);
    border: none;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 30px;
    transition: all 0.3s ease;
    color: #fff;
    margin-top: 5px;
}
.btn-auth:hover {
    background: linear-gradient(135deg, #6610f2, #007bff);
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.alt-link {
    margin-top: 18px;
    display: block;
    color: #007bff;
    font-weight: 500;
    text-decoration: none;
    transition: 0.3s;
}
.alt-link:hover {
    color: #6610f2;
    text-decoration: underline;
}
@keyframes fadeInUp {
    from {opacity: 0; transform: translateY(40px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>

<div class="auth-wrapper">
  <div class="auth-card position-relative">
    <h1>Register 🔐</h1>
    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="mb-3 position-relative">
        <i class="bi bi-person-fill input-icon"></i>
        <input type="text" class="form-control" name="username" required placeholder="Username">
      </div>
      <div class="mb-3 position-relative">
        <i class="bi bi-envelope-fill input-icon"></i>
        <input type="email" class="form-control" name="email" required placeholder="Email">
      </div>
      <div class="mb-3 position-relative">
        <i class="bi bi-lock-fill input-icon"></i>
        <input type="password" class="form-control" name="password" required placeholder="Password">
      </div>
      <div class="mb-3 position-relative">
        <i class="bi bi-lock-fill input-icon"></i>
        <input type="password" class="form-control" name="confirm_password" required placeholder="Confirm Password">
      </div>
      <button type="submit" class="btn-auth w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i> Register
      </button>
    </form>
    <a href="{{ url_for('auth.login') }}" class="alt-link">Already have an account? Login</a>
  </div>
</div>
{% endblock %}
